# test 프로필: 기본 설정(application.yml) 위에 DB 설정만 덮어쓴다.
# 기본 테스트(./gradlew test)는 MSSQL 없이 H2 메모리 DB로 실행하고,
# 실제 MSSQL 스키마 검증은 통합 테스트(./gradlew integrationTest)에서 한다.
spring:
  datasource:
    url: jdbc:h2:mem:minimes;MODE=MSSQLServer;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop   # 엔티티 구조대로 테이블을 만들고 테스트가 끝나면 지운다

mes:
  mqtt:
    enabled: false   # 테스트는 브로커 없이 실행한다. 수집기 로직은 MqttCollectorTest가 직접 부른다
  tool-life:
    enabled: false   # 테스트가 refresh()를 직접 부른다
  aggregation:
    enabled: false   # 집계 스케줄러가 테스트 중간에 끼어들지 않게 끈다. 집계는 테스트가 직접 부른다
  monitoring:
    push:
      enabled: false   # 대시보드 조회 SQL은 MSSQL 전용이라 H2에서 돌지 않는다. push는 DashboardPushTest가 따로 켜서 본다
