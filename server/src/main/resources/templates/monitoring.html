<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>설비 현황 - Mini-MES</title>
    <link rel="stylesheet" th:href="@{/css/monitoring.css}">
</head>
<!-- API 주소는 서버가 정해 data-* 속성으로 JS에 넘긴다 -->
<body th:data-api-url="@{/api/monitoring/dashboard}" th:data-alarm-url="@{/api/alarms}" th:data-ws-path="@{/ws}">
<header class="top">
    <div>
        <h1>설비 현황</h1>
        <p class="sub">CNC01~05 · 공장 시계 <strong id="factory-now">-</strong> · 오늘 <strong id="prod-date">-</strong></p>
    </div>
    <p class="refresh"><a class="nav" th:href="@{/monitoring/pareto}">정지 사유 파레토 →</a> · <a class="nav" th:href="@{/lots/trace}">LOT 추적 →</a> · <span id="connection" class="connection">연결 중</span> · 마지막 갱신 <span id="refreshed-at">-</span></p>
</header>

<!-- 서버에 연결할 수 없을 때만 보인다 (hidden 속성을 JS가 켜고 끈다) -->
<p id="error" class="error" hidden>서버에서 데이터를 받지 못했습니다. 잠시 후 다시 시도합니다.</p>

<!-- 설비 카드가 들어갈 자리. 처음엔 비어 있고 monitoring.js가 채운다 -->
<main id="cards" class="cards"></main>

<p class="note">품질(양품률)은 POP에서 등록한 불량으로 계산합니다. 불량을 입력하지 않은 날은 100%입니다.</p>

<!-- STOMP 클라이언트(@stomp/stompjs). 서버의 webjar에서 받는다 -->
<script th:src="@{/webjars/stomp__stompjs/bundles/stomp.umd.min.js}"></script>
<script th:src="@{/js/monitoring.js}"></script>
</body>
</html>
