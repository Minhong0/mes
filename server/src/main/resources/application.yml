spring:
  application:
    name: mes-server
  config:
    # 저장소 루트의 .env(MSSQL_SA_PASSWORD 등)를 설정으로 읽는다. 파일이 없으면 무시한다.
    # server 폴더에서 실행하면 ../.env, 저장소 루트에서 실행하면 .env를 찾는다.
    import: "optional:file:../.env[.properties],optional:file:.env[.properties]"
  datasource:
    url: jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:minimes};encrypt=true;trustServerCertificate=true
    username: ${DB_USERNAME:sa}
    password: ${MSSQL_SA_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate   # 스키마는 db/ddl의 SQL로 관리하고, 시작할 때 엔티티와 DB 구조가 맞는지만 검사한다
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  thymeleaf:
    cache: false
  task:
    scheduling:
      pool:
        size: 2   # @Scheduled 작업이 둘(일별 집계, 대시보드 push). 기본 1개면 집계하는 동안 push가 밀린다

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true          # bom_level 컬럼 → bomLevel
    arg-name-based-constructor-auto-mapping: true   # record(BomNode)를 생성자 파라미터 이름으로 매핑

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    com.minimes.equipment: info   # debug로 바꾸면 저장한 메시지를 한 건씩 출력한다

management:
  endpoints:
    web:
      exposure:
        include: health,info

mes:
  mqtt:
    enabled: true                               # false면 수집기를 만들지 않는다 (테스트 프로필)
    broker-url: ${MQTT_URL:tcp://localhost:1883}
    client-id: minimes-server-collector         # 고정 ID: 재접속하면 브로커가 보관해 둔 세션을 이어받는다
    topic: minimes/equipment/+/data             # + 자리에 설비 코드 (CNC01 ~ CNC05)
  aggregation:
    enabled: true          # false면 일별 집계 스케줄러를 만들지 않는다 (테스트 프로필)
    initial-delay: PT10S   # 서버가 뜨고 10초 뒤 첫 집계
    interval: PT1M         # 그 뒤로 1분마다 (앞 집계가 끝난 때부터 셈)
  monitoring:
    push:
      enabled: true    # false면 대시보드 push를 하지 않는다 (테스트 프로필). 화면은 5초 조회로 동작한다
      interval: PT1S   # 바뀐 것이 있으면 이 주기마다 최대 한 번 보낸다
