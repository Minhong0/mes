# 로컬 개발용 설정: 인증 없이 1883 포트 허용
listener 1883
allow_anonymous true
log_dest stdout

# 영속 세션 보관: 서버(수집기)가 꺼져 있는 동안 온 메시지를 브로커가 쌓아 두었다가 재접속하면 보낸다.
# persistence true면 브로커를 재시작해도 그 세션과 쌓인 메시지를 파일(/mosquitto/data)에서 되살린다.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# 접속이 끊긴 구독자 한 명당 쌓아 둘 수 있는 메시지 수. 기본값 1000은 60배속 기준 약 40분이라 늘린다.
max_queued_messages 100000
